# Game members the binder can't pick by name and metadata order, each proven from the game's own call of it (tools/re disasm.py)
# System.Random's three Next overloads: the Switch's corlib Random (JKISS32, not Mono's) has them in another order than Mono's metadata
# (Next(int, int), Next(int), Next(); vtable 0x4594cb0 slots 0x20 / 0x28 / 0x30 hold those bodies). Proven by rnd.cpp's boot self-test:
# through these addresses a seed-42 Random gives .NET's Next() 1434747710 and Next(5, 10) 7. Without the pins Next() bound to Next(int, int).
