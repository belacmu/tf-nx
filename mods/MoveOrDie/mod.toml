# Move or Die (MoveOrDie: ebe1.kenobi's FortRise mod, our `online` branch), a TF.NX catalog mod: mods/README.md says what each key means.
# Translated with no rule of its own: translate.toml [code_mods] "moveordie/" (auto: its Mod subclass and patch classes read from its source).
meta = "meta.json"                         # its release's meta.json (vendor/moveordie/ModFile/meta.json at the vendored commit)
logic = "translated"
vendored = "../../vendor/moveordie/VSCode" # its source: the "Content/..." literals it reads are in `needs`
needs = ["Content/Atlas/gamemode.png", "Content/Atlas/moveordie.png"]
boot = "tfex::gen::codemods::Boot_MoveOrDie"   # generated (CodeGen.CodeModBoots)

[folder]
build = "./build_folder.sh"                # its ModFile folder from the vendored source (meta.json and Content/)
extras = false

[overview]
source = "vendor/moveordie: ebe1kenobi/tf-mod-fortrise-variant-moveordie, its dev/fortrise5 (b497071; our `online` branch needs TF.EX's mod modes online, not upstream)"
download = "the mod's GitHub release (its ModFile folder); not hosted by TF.NX (no licence yet)"
permission = "not asked yet (no licence): not in TF.NX's release"
works = "local: the MoveOrDie variant; its mode in GAME MODE's list before TF.EX's Netplay mode (FortRise's load order: FrModsBoot); online: no (mod modes online wait for TF.EX)"

[check]
with = ["tools/megamod/localrun.sh 2 3 'localvariant MoveOrDie/MoveOrDie'"]   # Last Man Standing with the variant on: idle players die
expect = ["[mods] MoveOrDie constructed: 2 of 2 patch classes hooked", "[mmtest] custom variant MoveOrDie/MoveOrDie on", "[mmtest] first death"]
