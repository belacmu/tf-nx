why = "no clipboard on the Switch: TF.EX's COPY CODE (Alt2 tap on a private lobby's roll call) shows the code in its notification instead of copying it (TF.EX's checks, sound and Notification otherwise); its guide reads SHOW CODE (Rewrites.SpectateGuide)"

