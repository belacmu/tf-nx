[scope]
# Phase 1 (docs/CORE-FLOW.md THE PLAN): the translator's coverage covers ALL of TF.EX (src/network), minus only what the Switch
# deliberately replaces. tools/tfex/translate.sh coverage reads this table; the report lists the exclusions.
# 2026-10-18 (evaluation rec. 8): TF.State's gameplay patches too (state/TF.State.Patchs, the gameplay services of TF.State.Domain,
# the owned-state controllers of TowerFallExtensions); their serialization stays out ([scope.exclude], and the [skip] S-rollback keys).
include = ["network/", "state/TF.State.Patchs/", "state/TF.State.Domain/", "state/TF.State.TowerFallExtensions/"]

[scope.exclude]
# "<path glob>" = "<why>"  (a trailing / = the whole folder; * within a path segment, ** across)
"network/TF.EX.Domain/Externals/GGRSFFI.cs" = "GGRS FFI (the Rust ggrs library over P/Invoke): the Switch's rollback engine is native (xplay.cpp, rollback.cpp, ggrs-switch)"
"network/TF.EX.Common/Handle/" = "native memory handles for the GGRS FFI's results (SafeBytes / SafeHandle / SafeRawBytes): part of the replaced rollback engine"
"network/TF.EX.Domain/Models/StatusImpl.cs" = "GGRS FFI result wrappers (Status, StatusImpl, InfoHandle over native memory): part of the replaced rollback engine"
"network/TF.EX.Domain/Models/EventsImpl.cs" = "GGRS FFI event list (native string array): part of the replaced rollback engine"
"network/TF.EX.Domain/Models/NetplayRequestsImpl.cs" = "GGRS FFI request list (native array): part of the replaced rollback engine"
"network/TF.EX.Domain/Interop/ITfStateApi.cs" = "TF.State bridge (state serialization / restore): the Switch's rollback engine snapshots memory instead"
"network/TF.EX.Domain/Interop/StateApi.cs" = "TF.State bridge (state serialization / restore): the Switch's rollback engine snapshots memory instead"
"network/TF.EX.Domain/Services/SteamIdentity.cs" = "Steam identity: no Steam on the Switch"
"network/TF.EX.Domain/Services/ClipboardService.cs" = "desktop clipboard (SDL): none on the Switch"
"network/TF.EX.Domain/Services/UpnpService.cs" = "UPnP port mapping on the desktop's router: the Switch connects through the relay / WebRTC"
"network/TF.EX.Common/AutoUpdater.cs" = "desktop auto-updater (FortRise's ModUpdater, the PC's files): the Switch's IAutoUpdater is program/tfnxupdate.cpp (TF.NX's releases)"
