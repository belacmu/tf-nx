[package]
name = "tfx-rtc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m-rust-crypto = "0.6"

[dev-dependencies]
tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
opt-level = 2

[patch.crates-io]
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto" }
# FORWARD-TSN storm on max-retransmits-0 channels fixed (docs/ws-rtc-perf.md)
sctp-proto = { path = "vendor/sctp-proto" }
