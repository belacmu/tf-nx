[[unit]]
name = "GlueSkins"                  # TF.EX's skin services where they meet .NET / MessagePack-CSharp (translator/glue/Skins.cs: OUR OWN CODE)
file = "glue/Skins.cs"
type = "Skins"

[[rewrite]]
call = "MessagePack.MessagePackSerializer.Serialize<TF.EX.Domain.Models.Skin.ArcherSkinBundle>(TF.EX.Domain.Models.Skin.ArcherSkinBundle, MessagePack.MessagePackSerializerOptions?, System.Threading.CancellationToken)"
to = "TfexGlue.Skins.Serialize"
why = "MessagePack-CSharp's formatter for a [MessagePackObject] class: its integer keys as an array (glue/Skins.cs; the runtime's writer)"

[[rewrite]]
call = "MessagePack.MessagePackSerializer.Deserialize<TF.EX.Domain.Models.Skin.ArcherSkinBundle>(System.ReadOnlyMemory<byte>, MessagePack.MessagePackSerializerOptions?, System.Threading.CancellationToken)"
to = "TfexGlue.Skins.Deserialize"
why = "as Serialize: null for bytes that aren't a bundle (TF.EX catches MessagePack's exception and drops the bundle)"

[[rewrite]]
call = "System.Security.Cryptography.SHA256.HashData(byte[])"
to = "TfexGlue.Skins.Sha256"
why = "not in the Switch's Mono: the runtime's SHA-256 (the bundle id)"

[[rewrite]]
call = "System.Convert.ToHexString(byte[])"
to = "TfexGlue.Skins.HexUpper"
why = "not in the Switch's Mono (.NET 5): upper-case hex, as .NET's"

[[rewrite]]
call = "Microsoft.Xna.Framework.Graphics.Texture2D.GetData<Microsoft.Xna.Framework.Color>(int, Microsoft.Xna.Framework.Rectangle?, Microsoft.Xna.Framework.Color[], int, int)"
to = "TfexGlue.Skins.GetData"
why = "the Switch has the game's GetData<Color>(Color[]) (whole texture), not this overload: the whole texture, then the rect's pixels"

[[rewrite]]
call = "Microsoft.Xna.Framework.Graphics.Texture2D.SetData<Microsoft.Xna.Framework.Color>(Microsoft.Xna.Framework.Color[])"
to = "TfexGlue.Skins.SetColors"
why = "the Switch's game expands SetData<Color>(Color[]) inline (no callable body): its two calls (Teams+'s Recolor)"

[[rewrite]]
call = "Microsoft.Xna.Framework.Graphics.Texture2D.SetData<byte>(byte[])"
to = "TfexGlue.Skins.SetData"
why = "the Switch has the game's SetData<Color>(Color[]): the same RGBA bytes as Colors"

[[replace]]
member = "TF.EX.Domain.Services.SkinStreamService.Deflate"
to = "TfexGlue.Skins.Deflate"
key = "S-native"
why = "MemoryStream + DeflateStream(CompressionLevel.Optimal): raw DEFLATE by the runtime (miniz_oxide, the Rust lib's tfx_deflate)"

[[replace]]
member = "TF.EX.Domain.Services.SkinStreamService.InflateRgba"
to = "TfexGlue.Skins.InflateRgba"
key = "S-native"
why = "TF.EX's checks kept; its DeflateStream read (exactly the expected bytes, nothing after) as one raw inflate (tfx_inflate) into that size"

[[replace]]
member = "TF.EX.Domain.Services.SkinOverlayService.Clone"
to = "TfexGlue.Skins.Clone"
key = "S-native"
why = "object.MemberwiseClone through reflection (typeof(object).GetMethod): the game's MemberwiseClone"

[[rewrite]]
call = "System.Convert.FromBase64String(string)"
to = "TfexGlue.Skins.FromBase64"
why = "the game's runtime has no base64 decoding (Mono's InternalFromBase64String icall, +0x6cb0, always throws): the runtime's decoder (an invalid string: an empty byte[], as TF.EX's FormatException handlers treat it)"

