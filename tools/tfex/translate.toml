# TF.EX's ApiSurfaceTests (tests/TF.EX.Utils) on the Switch's side: TF.EX's interop interface against the provider the Switch runs, checked
# on every code run (translator RuleCheck.CheckInterop). TF.Replay's pairs aren't here: replays aren't on the Switch.
[[interop]]
consumer = "TF.EX.Domain.Interop.ITfStateApi"
provider = "TF.State.Core.Api.TfStateApi"

[[interop]]
consumer = "TF.EX.Common.Interop.IWiderSetModApi"   # TF.EX's copy of WiderSet's API
provider = "TfexGlue.WiderSetApi"                    # the Switch's wide mode (translator/glue/WiderSetApi.cs)

[[interop]]
