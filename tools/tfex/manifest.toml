# Where our port implements each TF.EX member (TFEX-BASE.md section 7, layer 3). Read by tools/tfex/update.py.
#   key  = "<file under vendor/tfex/src> <Type>.<Member>" (Member without "(...)" = all overloads; "Type.*" = the type; "<file> *" = the file;
#          the file part is an fnmatch glob). A manifest entry wins over an override for the same member.
#   at   = our file (relative to hw-probe/exlaunch/source/program) and function(s); "a.cpp F; b.cpp G" for several places
#   conf = high (cites TF.EX / same logic) | medium (same job, other structure) | low (guess)
#   note = "partial: <missing>" / "R S-xxx" (reimplemented on purpose, TFEX-BASE.md section 3 key)
#   hash = the upstream body hash the port matches (tools/tfex/manifest.py fill <tag> after porting <tag>); update.sh flags the
#          entry stale when the new tag's hash differs.
