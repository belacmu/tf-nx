provider = "TfexGlue.WiderSetApi"

[[interop]]
consumer = "TF.EX.Domain.Interop.ITfReplayApi"
absent = "TF.Replay isn't on the Switch (step 8, the user's decision): its API is null, as FortRise's GetApi without the mod"

[[interop]]
consumer = "TF.EX.Domain.Interop.IInputDisplayerApi"
absent = "TF.InputDisplayer (a desktop overlay) isn't on the Switch: its API is null, as FortRise's GetApi without the mod"

[[interop]]
consumer = "TFModFortRiseProfiles.IProfilesModApi"   # LoaderAI's copy of the Archer mod's API (the player names)
provider = "TfexGlue.ProfilesApi"                     # Archer isn't on the Switch (no profiles, no Forge): names kept, not drawn

[[interop]]
consumer = "TFModFortRiseLoaderAI.ILoaderAIModApi"   # AIJimmy's copy of LoaderAI's API
provider = "TFModFortRiseLoaderAI.ApiImplementation"

[[interop]]
consumer = "TFModFortRiseGameModeSoccer.ISoccerApi"   # AIJimmy's copy of Soccer's API
provider = "TFModFortRiseGameModeSoccer.ApiImplementation"

[[interop]]
consumer = "TFModFortRiseGameModePlaytag.IPlayTagApi"
absent = "PlayTag isn't on the Switch: its API is null, as FortRise's GetApi without the mod"

# ---- FortRise code mods translated onto the Switch: each its own compilation (Workspace.ForMod) of the folder `src` (from the repo's
# root), for the units whose file starts with the key; `structs`: the prefix of its structs' names ----
[code_mods]
"teamplus/" = { src = "vendor/teamplus/src", structs = "Tp_", mod = "TeamsPlus", native = "tfex::teamplus::InstallNative" }   # native: its 3 IL edits (TeamPlusNative.cpp)
"soccer/" = { src = "vendor/soccer/VSCode", structs = "So_", mod = "Soccer", auto = true, public = false }   # ebe1.kenobi's Soccer, the original (its main, 5f612de): its entry points read from its source
"loaderai/" = { src = "vendor/loader-ai/VSCode", structs = "La_", mod = "LoaderAI", auto = true, public = false }   # ebe1.kenobi's LoaderAI (dev/fortrise5, 3643fdb): hands an archer's input to an AI mod
"ainova/" = { src = "vendor/ai-nova/VSCode", structs = "An_", mod = "AINova", auto = true, public = false }   # ebe1.kenobi's AINova (main, 03a3847): a bot that simulates the archer's physics, through LoaderAI's API
"aijimmy/" = { src = "vendor/ai-jimmy/VSCode", structs = "Aj_", mod = "AIJimmy", auto = true, public = false }   # ebe1.kenobi's AIJimmy (dev/fortrise5, 7292e15): the bot, through LoaderAI's API
"moveordie/" = { src = "vendor/moveordie/VSCode", structs = "Md_", mod = "MoveOrDie", auto = true, public = false }   # ebe1.kenobi's Move or Die (our `online` branch at 94e5f8d: the mod-mode API the TF.EX we carry has): its entry points read from its source
# (`public = false`: no licence to distribute its translation: left out of the public tree's gen/, TFEX_PUBLIC=1; `mod`: its meta.json name: a generated boot, tfex::gen::codemods::Boot_<mod>, CodeGen.CodeModBoots; `native`: its IL edits' patches)

# ---- game methods that run before the Switch constructs code mods (after GameData.Load; FortRise: in Main, before TFGame.Load): a mod's
# postfix on one is called once at its boot (HookGen ReplayLoadTime). ArcherData.Initialize: Teams+'s team data (Blue, Red, Yellow) ----
[hooks]
load_time = ["TowerFall.ArcherData.Initialize"]

# ---- MonoMod ModInterop between mods: a [ModImportName("N")] class's delegate fields are the [ModExportName("N")] class's static methods
# of the same names; on the Switch a mod's call of an import is a call of the unit translating the export class (UnitEmitter
# ModImportUnit), and typeof(X).ModInterop() is nothing ----
[mod_exports]
"TF.EX.API" = "Ex_ModExports"
"TF.State.API" = "St_ModExports"

[[unit]]
name = "St_ModExports"               # TF.State's mod API (TF.State.Core/Api/ModExports.cs): a mod's own state in the rollback state (its
file = "state/TF.State.Core/Api/ModExports.cs"   # bytes, its entities), the gameplay RNG bracket; called by translated mods
type = "ModExports"
members = ["RegisterVariantStateEvents", "UnregisterVariantStateEvents", "RegisterRng", "UnregisterRng", "ShouldFreezeCosmetics"]   # (v0.29.0; a mod's own state and entities, RegisterStateEvents / RegisterEntityStateEvents: our fork's, Fcornaire/TF.EX#314, not upstream: no forks in main)

[[unit]]
name = "Ex_ModExports"               # TF.EX's EX-API (TF.EX.API/ModExports.cs): IsPlayingOnline, the mod versus modes' registration and
file = "network/TF.EX.API/ModExports.cs"   # round load (docs/PLAN-MOD-MODES-ONLINE-2026-10-31.md), called by translated mods
type = "ModExports"

# ---- Interfaces the Switch calls across compilations (CodeGen.Dispatch): generated tfexgen_dispatch_<file>.cpp, the hand header's
# functions; `default`: the interface's default body (FortRise's IVersusGameMode: NameColor white, GetMinimumPlayers 2, ...) ----
[dispatch."FortRise.IVersusGameMode"]   # the registered modes: TF.EX's Netplay, Teams+'s, every code mod's (FrVersusModes.hpp)
file = "frvmodes"
ns = "tfex::frvmodes"
header = "../FrVersusModes.hpp"
log = "[frvmodes]"
members.Name = { sig = "void* Name(void* mode)", default = "nullptr" }
members.NameColor = { sig = "gen::Color NameColor(void* mode)", default = "gen::Color{0xFFFFFFFFu}" }
members.Icon = { sig = "void* Icon(void* mode)", default = "nullptr" }
members.IsTeamMode = { sig = "bool IsTeamMode(void* mode)", default = "false" }
members.OnStartGame = { sig = "void OnStartGame(void* mode, void* session)" }
members.OnCreateRoundLogic = { sig = "void* OnCreateRoundLogic(void* mode, void* session)", default = "nullptr" }
members.GetMinimumPlayers = { sig = "int32_t GetMinimumPlayers(void* mode, void* matchSettings)", default = "2" }
members.GetMinimumTeamPlayers = { sig = "int32_t GetMinimumTeamPlayers(void* mode, void* matchSettings)", default = "3" }

# ---- Teams+ (vendor/teamplus: our FortRise mod, ../three-team-mod/pc-fortrise; docs/PLAN-THREETEAM-FORTRISE-2026-10-31.md step 3) ----
# Its own compilation (Workspace.ForMod, files "teamplus/<path under src/>"). Its harmony.Patch(...) registrations are read as hooks
# (HookGen.ScanCalls); its three transpilers are native patches on the Switch (the plan's step 2 decision).

[[unit]]
name = "Tp_Module"                   # Teams+'s ThreeTeamModule: its constructor is the mod's boot (the mode, the art, the patches), run by the
file = "teamplus/ThreeTeamModule.cs"   # Switch's FortRise layer when sd:/xplay/mods/TeamsPlus is there (FrModsBoot.cpp); no FortRise.Mod object
type = "ThreeTeamModule"
hosted = true
members = [".ctor", "Log"]           # (the constructor: Ctor(self, content, context, logger), called by FrModsBoot.cpp)

[[unit]]
name = "Tp_Teams3"                   # Teams+: the groups (Blue, Red, Yellow, lone wolves), score slots, the live flag
file = "teamplus/Teams3.cs"
type = "Teams3"

[[unit]]
name = "Tp_GameMode"                 # Teams+: the versus mode (FortRise IVersusGameMode: name, icon, team mode, round logic)
file = "teamplus/ThreeTeamGameMode.cs"
type = "ThreeTeamGameMode"

[[unit]]
name = "Tp_RoundLogic"               # Teams+: its RoundLogic (spawning three groups and wolves, the round's end)
file = "teamplus/ThreeTeamRoundLogic.cs"
type = "ThreeTeamRoundLogic"

[[unit]]
name = "Tp_Assets3"                  # Teams+: its two images (mode icon, yellow banner), registered through FortRise's texture registry
file = "teamplus/Assets3.cs"
type = "Assets3"

# (Recolor.cs, Hooks/VisualHooks.cs: the gold / white sprite recolours, not on the Switch: overrides.toml VisualHooks.Load)

[[unit]]
name = "Tp_ColumnBanner"             # Teams+: the team select's column banner
file = "teamplus/UI/ColumnBanner.cs"
type = "ColumnBanner"

[[unit]]
name = "Tp_Selector"                 # Teams+: the four-column team select
file = "teamplus/UI/ThreeTeamSelector.cs"
type = "ThreeTeamSelector"

[[unit]]
name = "Tp_RulesHooks"               # Teams+: start gate, team sizes, friendly fire, score slots (prefixes)
file = "teamplus/Hooks/RulesHooks.cs"
type = "RulesHooks"
hooks = true
enable_all = false                   # (on with the mod: Teams+'s boot, not TF.EX's EnableAll)
exclude = ["OnPlayerDeath_Transpiler"]   # an IL edit: a native patch on the Switch (TeamsPlusNative.cpp)

[[unit]]
name = "Tp_DataHooks"                # Teams+: team data for yellow and the wolves (ArcherData)
file = "teamplus/Hooks/DataHooks.cs"
type = "DataHooks"
hooks = true
enable_all = false

[[unit]]
name = "Tp_MenuHooks"                # Teams+: the team select replaced by its four columns
file = "teamplus/Hooks/MenuHooks.cs"
type = "MenuHooks"
hooks = true
enable_all = false

[[unit]]
name = "Tp_LevelHooks"               # Teams+: team levels split per group
file = "teamplus/Hooks/LevelHooks.cs"
type = "LevelHooks"
hooks = true
enable_all = false

[[unit]]
name = "Tp_SafetyHooks"              # Teams+: the live flag at StartGame (its sensor-block transpiler: a native patch)
file = "teamplus/Hooks/SafetyHooks.cs"
type = "SafetyHooks"
hooks = true
enable_all = false
exclude = ["TeamLookup_Transpiler", "Load"]   # (Load: registrations only, overrides.toml)

[[unit]]
name = "Tp_ReviveHooks"              # Teams+: TEAM REVIVE for every group
file = "teamplus/Hooks/ReviveHooks.cs"
type = "ReviveHooks"
hooks = true
enable_all = false

[[unit]]
name = "Tp_ResultsHooks"             # Teams+: the results board's label rows (its transpiler: a native patch; LabelRowCount translated)
file = "teamplus/Hooks/ResultsHooks.cs"
type = "ResultsHooks"
exclude = ["LabelArray_Transpiler", "Load"]
