# Soccer (ebe1.kenobi's FortRise mod, the original: its main + our cobweb fix), a TF.NX catalog mod: mods/README.md says what each key means.
# Translated with no rule of its own: translate.toml [code_mods] "soccer/" (auto: its Mod subclass and patch classes read from its source).
meta = "meta.json"                         # its release's meta.json (vendor/soccer/ModFile/meta.json at the vendored commit)
logic = "translated"
vendored = "../../vendor/soccer/VSCode"    # its source: the "Content/..." literals it reads are in `needs`
needs = ["Content/Atlas/ball.png", "Content/Atlas/gamemode.png"]
boot = "tfex::gen::codemods::Boot_Soccer"  # generated (CodeGen.CodeModBoots)

[folder]
build = "./build_folder.sh"                # its ModFile folder from the vendored source (meta.json and Content/)
extras = false

[overview]
source = "vendor/soccer: ebe1kenobi/tf-mod-fortrise-gamemode-soccer main (5f612de) + our cobweb fix (8b1aa18 on belacmu/tf-mod-fortrise-gamemode-soccer fix-cobwebs-crash: the walls' cobwebs removed with the pitch; offered upstream as ebe1kenobi/tf-mod-fortrise-gamemode-soccer#1, 2026-11-06: back to its main once merged)"   # Cobwebs.SceneBegin threw on levels with them (console crash 2026-11-05); upstream: not sent yet
download = "the mod's GitHub release (its ModFile folder); not hosted by TF.NX (no licence yet)"
permission = "not asked yet (no licence): not in TF.NX's release"
works = "local: the SOCCER mode (2-8 players); online: not this version (our online fork adds it)"

[check]
with = ["tools/megamod/localrun.sh 2 SOCCER"]   # a local Soccer match by its GAME MODE name, on the map's first level (Sacred Ground: cobwebs,
                                                   # which threw before our fix, 8b1aa18)
expect = ["[mods] Soccer constructed: 6 of 6 patch classes hooked", "[mmtest] GAME MODE: SOCCER", "[mmtest] level ran 30 s"]
