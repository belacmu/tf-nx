[[replace]]
member = "TF.EX.Domain.MatchStatsReport.BuildRawStats"
to = "TfexGlue.GameFields.RawFields_MatchStats"
key = "S-native"
why = "typeof(MatchStats).GetFields + FieldInfo.GetValue: no reflection the translator can call on the Switch; the same keys and values, one line per field in metadata order (generated, glue/GameFields.cs)"

[[unit]]
name = "GlueStateMsgPack"           # generated: TF.State's GameState as MessagePack-CSharp's bytes (translate.sh state-msgpack)
file = "glue/StateMsgPack.cs"
type = "StateMsgPack"

[[rewrite]]
call = "MessagePack.MessagePackSerializer.Serialize<TF.State.Domain.Models.GameState>(TF.State.Domain.Models.GameState, MessagePack.MessagePackSerializerOptions?, System.Threading.CancellationToken)"
to = "TfexGlue.StateMsgPack.Serialize"
why = "MessagePack-CSharp's formatters for TF.State's GameState (generated glue) and its Lz4BlockArray compression (the runtime's port of its LZ4 codec)"

[[rewrite]]
call = "MessagePack.MessagePackSerializer.Deserialize<TF.State.Domain.Models.GameState>(System.ReadOnlyMemory<byte>, MessagePack.MessagePackSerializerOptions?, System.Threading.CancellationToken)"
to = "TfexGlue.StateMsgPack.Deserialize"
why = "as Serialize"

[[rewrite]]
call = "MessagePack.MessagePackSerializer.Serialize<TF.State.Domain.Models.MatchStats[]>(TF.State.Domain.Models.MatchStats[], MessagePack.MessagePackSerializerOptions?, System.Threading.CancellationToken)"
to = "TfexGlue.StateMsgPack.SerializeMatchStatsArray"
why = "VersusAwards' seed (MatchStatsExtensions.GetAwardsSeed): MessagePack-CSharp's default bytes of the stats (generated glue, no LZ4)"

[[rewrite]]
call = "Microsoft.Xna.Framework.Graphics.SpriteBatch.Begin(Microsoft.Xna.Framework.Graphics.SpriteSortMode, Microsoft.Xna.Framework.Graphics.BlendState, Microsoft.Xna.Framework.Graphics.SamplerState, Microsoft.Xna.Framework.Graphics.DepthStencilState, Microsoft.Xna.Framework.Graphics.RasterizerState, Microsoft.Xna.Framework.Graphics.Effect, Microsoft.Xna.Framework.Matrix)"
to = "TfexGlue.Rewrites.SpriteBatchBegin"
key = "S-native"
why = "the Switch's MonoGame SpriteBatch.Begin takes the transform as a Matrix? (64 bytes, then hasValue at +0x40, by pointer; SwitchHud.hpp), the PC's FNA a Matrix: passed bare, hasValue was stack garbage and TF.EX's transform was dropped (its roll-call overlay without the UI camera's +50, 2026-10-29 console; PlayerPatch.RefreshSprites' too). The runtime's SpriteBatchBegin passes it as the Switch's"

[[rewrite]]
call = "TF.EX.Domain.Ports.IMatchmakingService.JoinLobby(string, bool, System.Action, System.Action)"
in = "TF.EX.Patchs.Scene.MainMenuPatch"
to = "TfexGlue.Rewrites.JoinLobbyNoSpectate"
key = "D"
why = "spectators aren't on the Switch yet (step 4): the lobby list's SPECTATE says so instead of joining as a spectator; a player's join unchanged (glue/Rewrites.cs). Remove with spectators"

[[rewrite]]
call = "TowerFall.MenuButtonGuide.SetDetails(TowerFall.MenuButtonGuide.ButtonModes, string)"
in = "TF.EX.Patchs.Scene.MainMenuPatch"
to = "TfexGlue.Rewrites.SpectateGuide"
key = "D"
why = "the lobby list's SPECTATE guide hidden while spectators aren't on the Switch (step 4); every other guide unchanged. Remove with spectators"

[[rewrite]]
call = "System.Array.Clear(System.Array)"
to = "TfexGlue.Rewrites.ArrayClear"
why = "not in the Switch's Mono (its one Clear is Clear(Array, int, int); bound by name, the one-argument call threw: VersusModeExtensions.RestorePerPlayerVariants): the whole array, Clear(a, 0, a.Length) (glue/Rewrites.cs)"

[[rewrite]]
call = "System.BitConverter.ToInt32(System.ReadOnlySpan<byte>)"
to = "TfexGlue.StateGlue.ToInt32"
why = "not in the Switch's Mono: the first 4 bytes little-endian (glue/State.cs)"

[[replace]]
member = "TF.State.Domain.Extensions.ActionExtensions.ToNames"
to = "TfexGlue.StateGlue.ActionNames"
key = "S-native"
why = "Delegate.Method isn't on the Switch's runtime: each delegate's name from its body (statert::ActionName; glue/State.cs)"

[[replace]]
member = "TF.State.Domain.ServiceCollections.AddEntityToCache"
to = "TfexGlue.StateGlue.AddEntityToCache"
key = "S-native"
why = "LazyCache (CachingService, MemoryCacheEntryOptions, expiry tokens) isn't on the Switch: a dictionary with TF.State's keys and its purges (glue/State.cs)"

[[replace]]
member = "TF.State.Domain.ServiceCollections.PurgeCachedPickup"
to = "TfexGlue.StateGlue.PurgeCachedPickup"
key = "S-native"
why = "as AddEntityToCache: the pickups' entries out of the dictionary (TF.State's IAppCache.Remove of each)"

[[replace]]
member = "TF.State.Domain.ServiceCollections.AddToCache"
to = "TfexGlue.StateGlue.AddToCache"
key = "S-native"
why = "as AddEntityToCache"

[[replace]]
