# TFEX-BASE.md section 6 (the hand reading of v0.19.2 -> v0.21.0) as expected labels, so update.py can check its rules.
# match = "<file glob> <member glob>" as in manifest.toml; class = the label the member must carry (it may carry others).
# Class E items are checked among the syntax-only changes.

