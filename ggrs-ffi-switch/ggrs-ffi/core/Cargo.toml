[package]
name = "ggrs-ffi"
version = "0.1.0"
edition = "2021"

[lib]
# TFEX-DIFF (Switch): also an rlib, linked into ggrs-switch's staticlib so the module carries one Rust std (two staticlibs
# would both define std's symbols).
crate-type = ["cdylib", "rlib"]

[features]
default = ["relay"]
# TF.EX's UDP relay (relay.rs). Off on the Switch (feature "switch"): see relay_browser.rs.
relay = ["dep:async-tungstenite"]
# The Switch build (../../README.md, docs/ws-ggrs-ffi.md): no threads (netplay_switch_pump drives what threads drive on PC), no relay,
# tracing into a queue the module reads.
switch = []

[dependencies]
bincode = "1.3.3"
bytemuck = "1.13.0"
flate2 = "1.0.25"
ggrs = { git = "https://github.com/Fcornaire/ggrs", branch = "develop" }
libc = "0.2.139"
pod = "0.5.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
uuid =  { version = "1.18.1",features = ["v4","fast-rng","macro-diagnostics",] }
macros = { version = "0.1.0", path = "../macros" }
matchbox_socket = "0.12.0"
futures = "0.3.28"
futures-timer = "3.0.2"
tokio = { version = "1.28.1", features = ["rt"] }
once_cell = "1.18.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# TF.EX's relay (relay.rs): not in the browser build (relay_browser.rs).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
async-tungstenite = { version = "0.29", default-features = false, features = ["async-std-runtime", "async-tls"], optional = true }
