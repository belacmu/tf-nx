# ---- TF.EX's update flow (TFGamePatch) on the Switch: TF.NX's updater underneath (program/tfnxupdate.cpp, glue Updates.cs) ----
[[rewrite]]
call = "System.Threading.Tasks.Task.Run(System.Func<System.Threading.Tasks.Task?>)"
in = "TF.EX.Patchs.Engine.TFGamePatch"
to = "TfexGlue.Updates.Run"
key = "S-native"
why = "the version check / the download on a game Thread (GC-registered), one at a time, off the game thread"

[[rewrite]]
call = "TF.EX.Domain.CustomComponent.UpdaterDialog.SetPhase(string)"
in = "TF.EX.Patchs.Engine.TFGamePatch"
to = "TfexGlue.Updates.RestartPhase"
key = "S-update"
why = "StartUpdate's \"RESTARTING\": the console can't relaunch the game for us, the dialog says to restart it (the user's choice, 2026-11-07)"

[[rewrite]]
call = "Microsoft.Xna.Framework.Game.Exit()"
in = "TF.EX.Patchs.Engine.TFGamePatch"
to = "TfexGlue.Updates.Restart"
key = "S-update"
why = "HandleAutoUpdate's restart after an update (FortRise.RiseCore.WillRestart + Exit): the player restarts the game, a notice says so"

[[rewrite]]
call = "TF.EX.Common.IAutoUpdater.GetCurrentVersion()"
in = "TF.EX.Domain.Services.MatchmakingService"
to = "TfexGlue.Updates.ServerVersion"
key = "S-update"
why = "the server's ?version= is TF.EX's version (its MIN_CLIENT_VERSION); the Switch's IAutoUpdater speaks TF.NX's 4-part version"

# ---- FortRise's additions to the game (bound against the patched reference, absent from the Switch's 1.4.1.6): reads give the
# default / an empty sequence, writes / calls on them / foreach over them do nothing: TF.EX with no FortRise mod loaded ----
[fortrise]
"FortRise.RiseCore.WillRestart" = { absent = true, key = "S-update", why = "FortRise's restart after a mod update (HandleAutoUpdate): no FortRise loader on the Switch; the player restarts the game (glue Updates.Restart)" }
"FortRise.ModuleSettings" = { absent = true, key = "S-settings", why = "FortRise's settings base (its UI, its JSON file): TF.EX's NetplaySettings derives from object on the Switch; Integration A's store loads / saves it" }
"FortRise.ModIO.OpenRead" = { absent = true, key = "S-native", why = "FortRise's file constructors of SFX / SFXVaried / SFXLooped (MonoModReplace of the game's own, which loads the game's sounds: not hooked here, so never called; units Fr_SFX ... translate the Stream ones)" }
"FortRise.ModIO.IsDirectoryOrFileExists" = { absent = true, key = "S-native", why = "as ModIO.OpenRead" }
"TowerFall.GamepadConfig" = { absent = true, key = "S-input", why = "the PC's XInput pad mapping type, not in the Switch's build (XGamepadInput.Config, below): no object of it exists, its members read as defaults" }
"TowerFall.XGamepadInput.Config" = { absent = true, key = "S-input", why = "the PC's XInput pad mapping (GamepadConfig); the Switch's XGamepadInput has none: the console maps its own controllers. Read as null (LoaderAI's ControlNames then draws no key names; the console's AI-slot button stands in for its keyboard, PLAN-TFNX section 11)" }
"TowerFall.patch_PlayerHair.Color" = { absent = true, side = true, key = "S-native", why = "FortRise adds the field to PlayerHair (MonoMod); the Switch's object has no room: per object in the side table (DynamicData's)" }
"TowerFall.patch_PlayerHair.OutlineColor" = { absent = true, side = true, key = "S-native", why = "as patch_PlayerHair.Color" }
"TowerFall.patch_PlayerHair.Offset" = { absent = true, side = true, key = "S-native", why = "as patch_PlayerHair.Color" }
"TowerFall.patch_PlayerHair.DuckingOffset" = { absent = true, side = true, key = "S-native", why = "as patch_PlayerHair.Color" }
"FortRise.PickupsRegistry.GetAllPickups" = { absent = true, key = "S-native", why = "FortRise's modded pickups: none on the Switch (TF.State's TreasureSpawnerPatch adds no extra arrow types)" }
"FortRise.PickupsRegistry.GetPickup" = { absent = true, key = "S-native", why = "FortRise's pickup registry: none on the Switch; null is 'module safe' in TF.State's TreasureSpawnerPatch.IsModuleSafe" }
"TowerFall.patch_RoundLogic.orig_GetRoundLogic" = { absent = true, orig = "GetRoundLogic", key = "S-native", why = "MonoMod's original body: on the Switch the original under FortRise's hook (HookGen, Fr_RoundLogic)" }
"TowerFall.patch_MatchSettings.orig_get_CanPlayThisMode" = { absent = true, orig = "get_CanPlayThisMode", key = "S-native", why = "as orig_GetRoundLogic (Fr_MatchSettings)" }
"TowerFall.MatchSettings.IsCustom" = { absent = true, side = true, key = "S-native", why = "FortRise adds the field to MatchSettings (MonoMod); the Switch's object has no room: per object in the side table (DynamicData's)" }
"TowerFall.patch_MatchSettings.IsCustom" = { absent = true, side = true, key = "S-native", why = "as MatchSettings.IsCustom (FortRise's own code reads it)" }
"TowerFall.MatchSettings.CustomVersusModeName" = { absent = true, side = true, key = "S-native", why = "as IsCustom (TF.EX sets it through DynamicData, FortRise reads the property)" }
"TowerFall.patch_MatchSettings.CustomVersusModeName" = { absent = true, side = true, key = "S-native", why = "as IsCustom" }
"TowerFall.TreasureSpawner.orig_GetRandomArrowType" = { absent = true, orig = "GetRandomArrowType", key = "S-native", why = "FortRise's name for the vanilla body (it wraps GetRandomArrowType for modded arrows): on the Switch the original under the hook (TF.State's TreasureSpawnerPatch prefix calls it)" }
"TowerFall.Session.StartGame" = { after = "tfex::gen::svc::FortRiseStartGameTail($self)", key = "S-native", why = "FortRise's Session.StartGame (MonoModReplace) is the game's body plus a custom mode's OnStartGame at its end (Teams+ sizes the score arrays to its groups): that call, right after the Switch's own body" }
"TowerFall.TreasureSpawner.GetArrowShufflePickups" = { after = "tfex::gen::svc::FortRiseArrowShuffleTail($result)", key = "S-native", why = "FortRise's GetArrowShufflePickups (the PC's) is orig_ (the vanilla shuffle, trimmed to 2) + modded arrows (none) + list.Shuffle() again: one more gameplay draw inside TF.State's registration; the Switch has no FortRise (the page's stream: 9 draws at Session.StartGame, the Switch made 8)" }
"TowerFall.MapScene.NoRandom" = { absent = true, key = "S-native", why = "FortRise's towers kept out of RANDOM: none on the Switch (ResolveNetplayEntry's Clear is a no-op)" }
"TF.EX.Domain.Utils.Changelog.AddEntries" = { absent = true, key = "S-native", why = "Changelog.Parse's Markdig half (Parse is the glue's on the Switch: ChangelogMarkdown.cs has these steps)" }
"TF.EX.Domain.Utils.Changelog.InlineText" = { absent = true, key = "S-native", why = "Changelog.Parse's Markdig half (Parse is the glue's on the Switch: ChangelogMarkdown.cs has these steps)" }
"TF.EX.Domain.Utils.Changelog.ToRelease" = { absent = true, key = "S-native", why = "Changelog.Parse's Markdig half (Parse is the glue's on the Switch: ChangelogMarkdown.cs has these steps)" }
"TF.EX.Domain.Utils.Changelog.ToEntry" = { absent = true, key = "S-native", why = "Changelog.Parse's Markdig half (Parse is the glue's on the Switch: ChangelogMarkdown.cs has these steps)" }
"TF.EX.Domain.Utils.Changelog.ToBracketFree" = { absent = true, key = "S-native", why = "Changelog.Parse's Markdig half (Parse is the glue's on the Switch: ChangelogMarkdown.cs has these steps)" }
"TF.EX.Domain.Utils.Changelog.ToDisplayText" = { absent = true, key = "S-native", why = "Changelog.Parse's Markdig half (Parse is the glue's on the Switch: ChangelogMarkdown.cs has these steps)" }
"TF.EX.Patchs.InputDelayAdvisor.UpdateMouse" = { absent = true, key = "S-input", why = "the advisor's mouse drag on the delay track (Mouse.GetState, MInput.Mouse): no mouse on the Switch; its controller gesture (Alt2 + Left / Right) is TF.EX's" }
"TF.EX.Patchs.InputDelayAdvisor.GameMousePosition" = { absent = true, key = "S-input", why = "the PC mouse in screen coordinates (Game.Window, Screen.Scale), for UpdateMouse only" }
"TF.EX.Patchs.Entity.MenuItem.RollCallElementPatch.UpdateControllerIcon" = { absent = true, key = "S-input", why = "PC gamepad icons (xb360 textures) on the roll call: the Switch keeps its Joy-Con icons (its RollcallElement.HandleControlChange)" }
"TF.EX.Patchs.Scene.WiderSetMenu.IsSelectionState" = { absent = true, key = "S-wide", why = "WiderSet's mode screens: the Switch's own wide handling; ResolveNetplayEntryState then returns to Main or the default" }
"TF.EX.Domain.Services.SkinOverlayService.MemberwiseCloneMethod" = { absent = true, key = "same behaviour", why = "typeof(object).GetMethod(\"MemberwiseClone\") for Clone, which is the game's MemberwiseClone here ([[replace]] SkinOverlayService.Clone)" }
"TF.EX.Domain.Services.SteamIdentity.TryGet" = { absent = true, key = "S-platform", why = "Steamworks through reflection: no Steam on the Switch (null: no steam: id)" }
"TF.EX.Domain.Utils.GameFilesIntegrity.IsModified" = { absent = true, key = "S-native", why = "hashes the PC game folder against TF.EX's list: the Switch's romfs is the console's own (false)" }
"TF.EX.Domain.Utils.GameFilesIntegrity.Modified" = { absent = true, key = "S-native", why = "same (no modified files)" }
"TowerFall.RollcallElement.controlIcon" = { absent = true, side = true, key = "S-input", why = "PC's per-player controller Image at ControlIconPos (0, 90); the Switch's RollcallElement has none (its own icon subtexture +0xa0, drawn at the same place). TF.EX reads it by DynamicData (RollCallElementPatch.UpdateOpenSeat: the open-seat orb goes at its Position, it hides while the orb shows): the side table, where tfex/MainMenuPatch.cpp ControlIconStandIns puts an undrawn Image at (0, 90) per element" }

