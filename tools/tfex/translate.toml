[[rewrite]]
expr = "GetAllAvailableSubtexturesID()"
in = "FortRise.SubtextureRegistry"
cpp = "nullptr"
key = "S-native"
why = "FortRise's set of the game's texture names, read from its four atlas XMLs into a HashSet<string>: the Switch's build has no HashSet<string> (a value set holds 64), and the game's loaded atlases hold the same names (the next rewrite asks them)"

[[rewrite]]
expr = "getAll.Contains(id)"
in = "FortRise.SubtextureRegistry"
cpp = "tfex::gen::GlueFrMods::IsVanillaSubtexture(id)"
include = "tfexgen_GlueFrMods.hpp"
key = "S-native"
why = "whether the game's atlases have the texture (the names FortRise reads from their XMLs): asked of the loaded atlases (glue SwitchMods.IsVanillaSubtexture)"

