[capacity]
# runtime value maps (gen::ValMap, 64 entries by default) that TF.State fills further, by C# type: the per-frame snapshots SFXService and
# MatchStatsService keep for SFX_SNAPSHOT_HISTORY = 960 frames (every GetState saves one: at 64 they dropped one a frame from frame 64)
"System.Collections.Generic.Dictionary<int, System.Collections.Generic.List<TF.State.Domain.Models.SFX>>" = 1024
"System.Collections.Generic.Dictionary<int, TF.State.Domain.Models.MatchStats[]>" = 1024
# StateContext._soundEffects: every SFX's file name -> its SoundEffect (SFXPatch's constructor postfix; the game makes a few hundred)
"System.Collections.Generic.Dictionary<string, Microsoft.Xna.Framework.Audio.SoundEffect>" = 1024
# MatchStatsReport.BuildRawStats: one entry per field of the game's MatchStats / KillStats (113; glue/GameFields.cs)
"System.Collections.Generic.Dictionary<string, double>" = 128
# AIJimmy's path search (AILogic.FindPathUsingMovementLibrary): the cells it visited, up to a wide level's 42 x 24 = 1008 (at 64 it
# dropped them: 8193 drops in a console 8-player round, 2026-11-06); a hash index at this size (gen::ValSet)
"System.Collections.Generic.HashSet<Microsoft.Xna.Framework.Point>" = 1024
# FortRise's InternalCustomVariants (glue SwitchMods' SwitchMatchVariantsExt): the game's 88 variants (GameFieldsFr) and the mods' own
"System.Collections.Generic.Dictionary<string, TowerFall.Variant>" = 256
# and value lists (gen::VList, 128 inline entries by default) of big structs TF.State holds few of: GameState.MatchStats (one per player; 128 x
# 264 bytes made each save allocate 33 KB twice, most of what the GC collected at 240 Hz, 2026-10-29). 8: the game's 6 seats and room;
# more is a pools error (VList's PoolFull)
"System.Collections.Generic.List<TF.State.Domain.Models.MatchStats>" = 8
"System.Collections.Generic.IEnumerable<TF.State.Domain.Models.MatchStats>" = 8   # (GameState.MatchStats' declared type: the same list)

