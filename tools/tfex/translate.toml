# ---- hand rules: calls rewritten to glue, members replaced by the ledger ----
[[rewrite]]
call = "System.Threading.Tasks.Task.Run(System.Action, System.Threading.CancellationToken)"
in = "TF.EX.Domain.Services.NetplayManager"
to = "TfexGlue.Ffi.RunWorker"
key = "S-native"
why = "Task.Run(() => Connect(roundLogic), token): a game Thread (GC-registered), one at a time; netplay_init blocks there, not the game"

[[rewrite]]
call = "System.Threading.Tasks.Task.Run(System.Func<System.Threading.Tasks.Task?>, System.Threading.CancellationToken)"
in = "TF.EX.Domain.Services.MatchmakingService"
to = "TfexGlue.Ffi.RunListener"
key = "S-native"
why = "ConnectToServerAndListen's listen loop: a game Thread (GC-registered), one at a time; the ClientWebSocket stand-in blocks there"

[[rewrite]]
call = "TF.EX.Domain.Services.MatchmakingService.HandleMessageContents(string)"
in = "TF.EX.Domain.Services.MatchmakingService"
to = "TfexGlue.Ffi.HandleOnGameThread"
key = "S-net"
why = "the listen loop's message to the game thread, where TF.EX's handler runs (PumpTransport): the runtime's object pools aren't thread-safe"

[[rewrite]]
new = "System.ArraySegment<T>.ArraySegment(T[])"
in = "TF.EX.Domain.Services.MatchmakingService"
to = "TfexGlue.Ffi.Segment"
key = "S-net"
why = "new ArraySegment<byte>(buffer): the array itself (a segment over all of it; the socket's buffers)"

[[rewrite]]
call = "System.Threading.CancellationTokenSource.Cancel()"
in = "TF.EX.Domain.Services.MatchmakingService"
to = "TfexGlue.Ffi.CancelSockets"
key = "S-net"
why = "TF.EX's Close(): the cancellation ends the listen loop's receive (the stand-in's open socket aborts)"

[[rewrite]]
new = "TF.EX.Common.Handle.SafeBytes<T>.SafeBytes(T, bool)"
in = "TF.EX.Domain.Services.NetplayManager"
to = "TfexGlue.Ffi.GgrsConfigBytes"
key = "S-native"
why = "SafeBytes<GGRSConfig>(config, true) in NativeInit: TF.EX's JSON of the config in a runtime buffer (no MessagePack / Marshal on the Switch); its Fps and delays as TF.EX set them"

[[rewrite]]
new = "TF.EX.Common.Handle.SafeRawBytes.SafeRawBytes(byte[])"
in = "TF.EX.Domain.Services.NetplayManager"
to = "TfexGlue.Ffi.RawBytes"
key = "S-rollback"
why = "SaveGameState's bytes for ggrs_ffi: on the Switch rollback.cpp's 16-byte snapshot handle (TFEX-DIFF, performance)"

[[rewrite]]
new = "TF.EX.Common.Handle.SafeRawBytes.SafeRawBytes(TF.EX.Common.Handle.SafeBytesFFI, System.Action)"
in = "TF.EX.Domain.Services.NetplayManager"
to = "TfexGlue.Ffi.RawBytesFFI"
key = "S-rollback"
why = "LoadGameState: the bytes ggrs_ffi returns (the snapshot handle); Dispose frees them with netplay_free_game_state"

