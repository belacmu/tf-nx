# TF.EX -> Switch C++ translator configuration (tools/tfex/translator, README.md "Translator").

[refs]
# What TF.EX compiles against, for Roslyn's semantic model (types of every expression, overloads, game vs TF.EX members).
# TowerFall.exe: the PC game (1.3.3.3, the one the browser loads); FNA / FortRise / Harmony / DI: the browser's build;
# MessagePack, Markdig, LazyCache: TF.EX's release zip.
# The game: FortRise-patched first (docs/research-fortrise.md item 3: what TF.EX and the browser really run, so FortRise's members
# bind instead of being Invalid), made by the browser's tools/FortRisePatch from a copy of the Steam PC exe (1.3.3.x, FortRise
# 5.5.0-beta.3; TF.EX 0.21.0 targets beta.2): .cache/fortrise-patched/TowerFall.Patch.dll. Without it, the vanilla exe.
files = [
  "$TFEX_TOWERFALL_EXE",
  "~/Code/Towerfall Switch Mods/switch-online/.cache/fortrise-patched/TowerFall.Patch.dll",
  "/Applications/TowerFall.app/Contents/MacOS/TowerFall.exe",
  "~/Code/Towerfall Browser/web/bin/Release/net10.0/FNA.dll",
]
# Mono's mscorlib and the FNA the game shipped with: their metadata order of overloads is the Switch binary's (BRUTE emits
# method records in IL order), for members of corlib / FNA types (String, List`1, SpriteFont...).
mono = [
  "/Applications/TowerFall.app/Contents/MacOS/mscorlib.dll",
  "/Applications/TowerFall.app/Contents/MacOS/System.dll",
  "/Applications/TowerFall.app/Contents/MacOS/System.Core.dll",
  "/Applications/TowerFall.app/Contents/MacOS/System.Xml.dll",   # FortRise.Content's loaders read XML (XmlNode.get_Item, XmlDocument.Load)
  "/Applications/TowerFall.app/Contents/MacOS/FNA.dll",
]
dirs = [
  "~/Code/Towerfall Browser/vendor/fortrise/lib",
  "~/Code/Towerfall Switch Mods/switch-online/.cache/tfex-0.19.2/zip/DShad.TF.EX",
]

[mods]
# The mods built into the module (runtime/tfexgen_mods.cpp's registry, the MODS menu, FortRise's interop for mods finding each other):
# their meta.json as TF.EX ships it, paths under vendor/tfex/src. TF.Replay and TF.InputDisplayer join when they're ported (step 8).
# FortRise's own entry comes from vendor/fortrise/version.txt.
builtin = ["network/TF.EX.Core/meta.json", "state/TF.State.Core/meta.json"]
# FortRise's internal mods the Switch runs (translated): their meta.json under vendor/fortrise. FortRise.Content: the content loaders
# (archers, sprites, textures), which content mods depend on
fortrise = ["InternalMods/FortRise.Content/meta.json"]

[mods.native]
# mods the Switch carries its own way (no source in vendor), always listed: their metadata as FortRise would read it. (WiderSet was here
# until 2026-11-04: it is a catalog mod now, Teuria.WiderSet below, listed only when its folder is on the card.)
# Archer (ebe1.kenobi's profiles and Forge): not on the Switch (the user, 2026-11-05); its profile names API, the part LoaderAI needs
# (SetPlayerName / GetPlayerName), stands in as glue TfexGlue.ProfilesApi ([[interop]]). Listed so LoaderAI's required dependency is met,
# as FortRise checks it (tfexgen_mods.cpp Resolve). (Online, a peer sees Archer 1.1.0 listed: the Switch has no profiles nor forged archers.)
"Archer" = '''{"name": "Archer", "version": "1.1.0", "displayName": "Archer (player names only)", "author": "ebe1.kenobi", "description": "On the Switch: only the profile names API LoaderAI uses (no profiles, no Forge)"}'''

# TF.NX's catalog mods (the code mods whose logic the module carries, each turned on by its folder): not here any more (2026-11-04):
# one folder per mod, mods/<name>/mod.toml, tools/mods/catalog.py -> modcatalog.gen.hpp (mods/README.md).

[models]
# Fixed storage for the lobby models (C# has no limits): default capacities, then per "Class.Prop" ("*.Prop": any class;
# ".item" = the elements of a list, ".key"/".value" = a dictionary's). Chosen like the hand-written tfex/Models.hpp.
string = 48
list = 16
map = 4
map_key = 24
map_value = 48

[models.caps]
"*.Name" = 40
"*.RoomPeerId" = 72
"*.RoomId" = 72
"*.room_peer_id" = 72
"PlayerProfile.Stats" = 120            # the server's totals per raw stat key: one per field of the game's MatchStats / KillStats (MatchStatsReport: 113)
"SeatStats.RawStats" = 120             # MatchStatsReport.BuildRawStats: 113 keys (glue/GameFields.cs), up to 25 characters ("DeathsDuringDodgeCooldown")
"SeatStats.RawStats.key" = 32
"PlayerProfile.Stats.key" = 40
"MatchEnded.Checksum" = 72              # TF.EX's LastStateChecksum: SHA-256 as 64 hex characters (the server compares both sides')
"Lobby.Players" = 8                     # capacity, not the rule: a wide lobby seats TFGame.Players.Length (the Switch's 8); more is a PoolFull error
"Lobby.MatchPlayers" = 8
"Lobby.Spectators" = 8
"Lobby.EndGameChoice" = 12
"Lobby.Mods" = 8
"Lobby.RelayedPairs" = 28              # every pair of 8 players (8 * 7 / 2)
"Lobby.RelayedPairs.item" = 2
"Lobby.RelayedPairs.item.item" = 72
"Player.Platform" = 32
"Lobby.Kind" = 16
"Lobby.JoinCode" = 16
"EndGameVote.Choice" = 16
"*.Message" = 96
"*.Reason" = 96
"*.AbortReason" = 96
"*.Status" = 16
"Series.Sides" = 4
"Series.Sides.item" = 4
"Series.Games" = 16
"Series.Picks" = 4
"SeriesGame.Scores" = 4
"MatchEnded.Scores" = 8
"GetLobbiesResponse.Lobbies" = 16
"SkinChunk.BundleId" = 72        # the SHA-256 of the bundle in hex: 64 characters
"SkinChunk.CustomArcherId" = 257  # TF.EX's SkinLimits.MaxStringLength (256)
"Player.CustomArcherId" = 257     # the same id in the lobby (FortRise's "<mod>/<archer>")
"SkinChunk.Data" = "managed"   # a 192 KB chunk in base64 (262 KB): a managed string reference (MStr), not fixed storage in every model ring copy

# ---- code units (translator CodeGen): tfexgen_<name>.{hpp,cpp} in namespace tfex::gen::<name> ----
# file (under vendor/tfex/src), type (the C# class), members (optional: these and what they call in the same class)

[[unit]]
name = "ConnectionIcon"
file = "network/TF.EX.Patchs/ConnectionIcon.cs"
type = "ConnectionIcon"

[[unit]]
name = "NetplaySettings"            # TF.EX's settings object (TF.EX.Core/NetplaySettings.cs): its properties and Apply (-> NetplayPreferences);
file = "network/TF.EX.Core/NetplaySettings.cs"   # Integration A's settings store makes one, loads / saves sd:/xplay/TF.EX.settings.json, calls Apply
type = "NetplaySettings"            # (Create / OnVerify / MigrateLegacyConfig: FortRise's settings UI and PC file paths, not on the Switch)
members = ["Apply", "Create"]   # Create: its options entries, on the Switch's OPTIONS screen (glue SettingsUi, tfex/NetplayOptions.cpp)

[[unit]]
name = "ArcherService"              # TF.EX's ArcherService (seats -> GGRS handles, the archers applied to TFGame.Characters / AltSelect / Players):
file = "network/TF.EX.Domain/Services/ArcherService.cs"   # Integration B2's native match start calls CompactSeatsToHandles + ApplyToGame
type = "ArcherService"              # (functions: its only field, _gameContext, is GameContext's archer store, svc::ArcherSelections ...)
hosted = true
members = ["AddArcher", "GetArchers", "GetFinalArchers", "CompactSeatsToHandles", "ApplyToGame", "RemoveArcher", "Reset"]

[[unit]]
name = "GameContext"                # TF.EX's GameContext, its own object (made at boot with the NetplayManager, svc::GameContextObj): the local
file = "network/TF.EX.Domain/Context/GameContext.cs"   # controller, the input lock (5 s timeout), the local seat, GetLocalPlayerIndex(es), the polled inputs (C2 step 2) and the
type = "GameContext"                # current inputs (step 3: GGRS's inputs of the frame being simulated, rollback's diagnostics read them); the
exclude = ["GetArchers", "GetPlayers", "AddArcher", "ResetArcherSelections", "RemoveArcher"]   # archer copies stay the runtime's (S-native)

[[unit]]
name = "InputService"               # TF.EX's InputService: the local controller (ObserveLocalDevice / RebindLocalInput), its seat
file = "network/TF.EX.Domain/Services/TF/InputService.cs"   # (EnsureLocalControllerSeats, the guests' inputs, DisableAllControllerExceptLocal) and the input lock
type = "InputService"               # (Disable / EnableAllControllers, IsInputLocked); its _context is GameContext's input store (IGameContext rules).
hosted = true                       # The Switch's own controller refresh waits while these hold PlayerInputs (tfex/InputLock.cpp, TFEX-DIFF S-input)
exclude = [".ctor"]                 # (the DI constructor: hosted, its object a token; `context` and _extraLocalInputs are [service] rules)
# (the whole class since TF.EX v0.28.0: its local players (guest inputs) live in it)

